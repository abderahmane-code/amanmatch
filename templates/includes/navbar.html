{% load i18n %}
<nav class="navbar">
    <a href="/" class="brand">Aman<span>Match</span></a>
    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">{% trans "Dashboard" %}</a>
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="nav-logout-btn">{% trans "Logout" %}</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">{% trans "Login" %}</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">{% trans "Sign Up" %}</a>
        {% endif %}
    </div>
</nav>
