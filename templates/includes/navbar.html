{% load i18n %}
<nav class="navbar">
    <a href="/" class="brand">Aman<span>Match</span></a>
    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url 'dashboard' %}">{% trans "Dashboard" %}</a>
            <a href="{% url 'accounts:logout' %}">{% trans "Logout" %}</a>
        {% else %}
            <a href="{% url 'accounts:login' %}">{% trans "Login" %}</a>
            <a href="{% url 'accounts:register' %}" class="btn btn-primary btn-sm">{% trans "Sign Up" %}</a>
        {% endif %}
    </div>
</nav>
