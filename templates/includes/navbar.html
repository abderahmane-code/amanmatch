{% load i18n %}
<nav class="navbar" role="navigation" aria-label="{% trans 'Main navigation' %}">
    <div class="container">
        <a href="/" class="nav-brand">
            <span class="brand-icon">&#9830;</span>
            <span>Aman</span>Match
        </a>

        <button class="nav-toggle" aria-label="{% trans 'Toggle menu' %}" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <div class="nav-links">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">{% trans "Dashboard" %}</a>
                <a href="{% url 'profiles:detail' %}" class="{% if request.resolver_match.url_name == 'detail' or request.resolver_match.url_name == 'edit' %}active{% endif %}">{% trans "Profile" %}</a>
                <a href="#" class="{% if request.resolver_match.url_name == 'verification' %}active{% endif %}">{% trans "Verification" %}</a>
                <a href="#" class="{% if request.resolver_match.url_name == 'matches' %}active{% endif %}">{% trans "Matches" %}</a>
                <a href="#" class="{% if request.resolver_match.url_name == 'messages' %}active{% endif %}">{% trans "Messages" %}</a>
                <a href="#" class="{% if request.resolver_match.url_name == 'safety' %}active{% endif %}">{% trans "Safety" %}</a>
                <form method="post" action="{% url 'accounts:logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit">{% trans "Logout" %}</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">{% trans "Login" %}</a>
                <a href="{% url 'accounts:register' %}" class="nav-cta">{% trans "Get Started" %}</a>
            {% endif %}
        </div>
    </div>
</nav>
